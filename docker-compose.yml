version: '3.8'

services:
  # ==========================================
  # MESSAGE BROKER: LavinMQ (AMQP 0-9-1)
  # ==========================================
  lavinmq:
    image: cloudamqp/lavinmq:latest
    container_name: bar-lavinmq
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web UI (http://localhost:15672, guest/guest)
    environment:
      - LAVINMQ_DEFAULT_USER=guest
      - LAVINMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "lavinmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bar-network

networks:
  bar-network:
    driver: bridge
